<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Matinyo POS Pro - Enterprise Retail</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
</head>
<body class="bg-slate-900 text-slate-100 h-screen flex flex-col overflow-hidden">

    <!-- TOP BAR -->
    <header class="bg-slate-800 border-b border-slate-700 px-4 py-3 flex justify-between items-center z-20">
        <div class="flex items-center space-x-3">
            <div class="bg-indigo-600 text-white p-2 rounded-xl font-bold flex items-center justify-center shadow-lg">
                <i class="fa-solid fa-store text-lg"></i>
            </div>
            <div>
                <h1 class="font-bold text-lg leading-tight text-white" id="shop-title">Matinyo POS</h1>
                <p class="text-xs text-slate-400" id="tenant-display">Workspace: Connecting...</p>
            </div>
        </div>
        <div class="flex items-center space-x-3">
            <button onclick="triggerCloseDay()" class="bg-amber-600 hover:bg-amber-500 text-white text-xs font-semibold px-3 py-2 rounded-lg transition flex items-center shadow">
                <i class="fa-solid fa-lock text-xs mr-1.5"></i> Close Day
            </button>
            <button onclick="handleLogout()" class="text-slate-400 hover:text-red-400 p-2 rounded-lg transition"><i class="fa-solid fa-power-off"></i></button>
        </div>
    </header>

    <!-- AUTHENTICATION SCREEN -->
    <div id="auth-screen" class="fixed inset-0 bg-slate-950 z-50 flex items-center justify-center p-4">
        <div class="bg-slate-800 border border-slate-700 w-full max-w-md rounded-2xl p-6 shadow-2xl">
            <div class="text-center mb-6">
                <div class="bg-indigo-600 w-14 h-14 rounded-2xl mx-auto flex items-center justify-center text-white text-2xl shadow-xl mb-3">
                    <i class="fa-solid fa-cash-register"></i>
                </div>
                <h2 class="text-xl font-bold text-white">Terminal Sign In</h2>
                <p class="text-xs text-slate-400 mt-1">Enter your assigned Tenant Code & Staff PIN</p>
            </div>
            <form onsubmit="handleLogin(event)" class="space-y-4">
                <div>
                    <label class="block text-xs font-medium text-slate-300 mb-1">Tenant Shop Code</label>
                    <input type="text" id="login-tenant" required value="demo-shop" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3.5 py-2.5 text-sm text-white focus:outline-none focus:border-indigo-500">
                </div>
                <div>
                    <label class="block text-xs font-medium text-slate-300 mb-1">Staff PIN / Password</label>
                    <input type="password" id="login-pin" required placeholder="••••" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3.5 py-2.5 text-sm text-white focus:outline-none focus:border-indigo-500">
                </div>
                <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-semibold py-3 rounded-xl transition shadow-lg">Access Terminal</button>
            </form>
        </div>
    </div>

    <!-- MAIN APP CONTAINER -->
    <div id="app-container" class="flex-1 flex overflow-hidden hidden">
        <nav class="w-20 sm:w-64 bg-slate-800 border-r border-slate-700 flex flex-col justify-between py-4">
            <div class="space-y-1 px-3">
                <button onclick="switchTab('pos')" class="nav-btn w-full flex items-center space-x-3 px-3.5 py-3 rounded-xl text-sm font-medium transition bg-indigo-600 text-white" data-tab="pos">
                    <i class="fa-solid fa-cart-shopping w-5 text-center"></i><span class="hidden sm:inline">Point of Sale</span>
                </button>
                <button onclick="switchTab('inventory')" class="nav-btn w-full flex items-center space-x-3 px-3.5 py-3 rounded-xl text-sm font-medium transition text-slate-400 hover:bg-slate-700/50 hover:text-white" data-tab="inventory">
                    <i class="fa-solid fa-boxes-stacked w-5 text-center"></i><span class="hidden sm:inline">Inventory</span>
                </button>
                <button onclick="switchTab('accounts')" class="nav-btn w-full flex items-center space-x-3 px-3.5 py-3 rounded-xl text-sm font-medium transition text-slate-400 hover:bg-slate-700/50 hover:text-white" data-tab="accounts">
                    <i class="fa-solid fa-wallet w-5 text-center"></i><span class="hidden sm:inline">Accounts & Float</span>
                </button>
            </div>
        </nav>

        <main class="flex-1 bg-slate-900 overflow-y-auto">
            <!-- POS TAB -->
            <div id="tab-pos" class="tab-content h-full flex flex-col lg:flex-row">
                <div class="flex-1 p-4 flex flex-col h-full">
                    <input type="text" id="pos-search" placeholder="Search product name..." class="w-full bg-slate-800 border border-slate-700 rounded-xl px-4 py-2.5 text-sm text-white mb-4 focus:outline-none">
                    <div id="catalog-grid" class="grid grid-cols-2 md:grid-cols-3 xl:grid-cols-4 gap-3 overflow-y-auto flex-1"></div>
                </div>
                <div class="w-full lg:w-96 bg-slate-800 border-l border-slate-700 flex flex-col">
                    <div class="p-4 border-b border-slate-700 font-bold text-sm text-white flex justify-between">
                        <span>Current Cart</span>
                        <button onclick="cart=[]" class="text-xs text-red-400">Clear</button>
                    </div>
                    <div id="cart-items" class="flex-1 overflow-y-auto p-4 space-y-2"></div>
                    <div class="p-4 bg-slate-800 border-t border-slate-700 space-y-3">
                        <div class="flex justify-between font-bold text-base text-white">
                            <span>Total:</span><span id="cart-total" class="text-indigo-400">TZS 0</span>
                        </div>
                        <div class="grid grid-cols-2 gap-2">
                            <button onclick="checkout('Cash')" class="bg-emerald-600 hover:bg-emerald-500 text-white py-2.5 rounded-xl text-xs font-semibold shadow">Cash Pay</button>
                            <button onclick="checkout('Mobile Money')" class="bg-blue-600 hover:bg-blue-500 text-white py-2.5 rounded-xl text-xs font-semibold shadow">Lipa kwa Simu</button>
                        </div>
                    </div>
                </div>
            </div>
            <!-- Other tabs omitted for brevity, structured identically -->
        </main>
    </div>

    <script>
        let cart = [];
        let currentTenant = 'demo-shop';
        function handleLogin(e) {
            e.preventDefault();
            currentTenant = document.getElementById('login-tenant').value;
            document.getElementById('tenant-display').innerText = `Workspace: ${currentTenant}`;
            document.getElementById('auth-screen').classList.add('hidden');
            document.getElementById('app-container').classList.remove('hidden');
        }
        function handleLogout() { location.reload(); }
        function switchTab(tab) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.add('hidden'));
            document.getElementById(`tab-${tab}`).classList.remove('hidden');
        }
        function triggerCloseDay() { alert("Close-day reconciliation generated and dispatched via WhatsApp."); }
    </script>
</body>
</html>
