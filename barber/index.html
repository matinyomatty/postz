<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Keep · Barbershop</title>
<meta name="theme-color" content="#0b0d12">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="../icon-192.png">
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=DM+Sans:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root { --ink:#0b0d12; --ink2:#161b27; --blue:#1a56db; --yellow:#ffc72c; --pos:#00875a; --red:#dc2626; --amber:#f59e0b; --light:#f2f4f8; --line:#e5e7eb; --gray:#6b7280; }
* { box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; }
html, body { min-height:100%; }
body { font-family:'DM Sans',system-ui,sans-serif; background:var(--light); color:var(--ink); font-size:15px; }
button { font-family:inherit; cursor:pointer; color:inherit; }
input, select, textarea { font-family:inherit; font-size:16px; color:var(--ink); }
.hidden { display:none !important; }
svg.ic { width:20px; height:20px; fill:none; stroke:currentColor; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round; flex-shrink:0; }

/* top tab bar — as in Keep */
.tabbar { display:flex; background:var(--ink); position:sticky; top:0; z-index:40; padding-top:env(safe-area-inset-top); border-bottom:3px solid var(--yellow); }
.tabbar button { flex:1; background:none; border:0; color:#8b93a7; padding:12px 4px 10px; font:800 .66rem 'DM Sans'; letter-spacing:1px; text-transform:uppercase; display:flex; flex-direction:column; align-items:center; gap:4px; position:relative; }
.tabbar button.on { color:var(--yellow); background:rgba(255,199,44,.08); }
.tabbar .badge { position:absolute; top:6px; left:calc(50% + 6px); background:var(--red); color:#fff; border-radius:999px; font-size:.62rem; min-width:17px; height:17px; display:flex; align-items:center; justify-content:center; padding:0 4px; letter-spacing:0; }

/* dark header */
.hdr { background:var(--ink); color:#fff; padding:14px 16px 16px; box-shadow:0 4px 16px rgba(0,0,0,.25); }
.hdr-top { display:flex; justify-content:space-between; align-items:center; gap:10px; margin-bottom:12px; }
.logo { font:800 1.05rem 'Syne'; letter-spacing:2.5px; color:var(--yellow); text-transform:uppercase; min-width:0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.logo .mod { color:#60a5fa; }
.me-chip { display:inline-flex; align-items:center; gap:6px; height:34px; padding:0 8px 0 4px; border-radius:999px; border:1px solid rgba(255,255,255,.18); background:rgba(255,255,255,.06); color:#fff; font:800 .72rem 'DM Sans'; letter-spacing:.5px; text-transform:uppercase; flex-shrink:0; }
.me-av { width:26px; height:26px; border-radius:50%; background:var(--yellow); color:var(--ink); display:inline-flex; align-items:center; justify-content:center; font-weight:800; font-size:.78rem; }
.me-chip.staff .me-av { background:#2b3244; color:#fff; }
.me-menu { position:fixed; z-index:9000; top:calc(60px + env(safe-area-inset-top)); right:12px; min-width:250px; background:#fff; color:var(--ink); border-radius:16px; box-shadow:0 18px 50px rgba(0,0,0,.28); padding:8px; animation:meIn .12s ease-out; }
@keyframes meIn { from { opacity:0; transform:translateY(-6px); } to { opacity:1; transform:none; } }
.me-menu .mm-head { display:flex; align-items:center; gap:10px; padding:8px 8px 12px; border-bottom:1px solid var(--line); margin-bottom:6px; }
.me-menu .mm-head .me-av { width:38px; height:38px; font-size:1rem; }
.me-menu .mm-sub { font-size:.72rem; color:var(--gray); }
.me-menu button { display:flex; align-items:center; gap:10px; width:100%; border:0; background:none; padding:11px 10px; border-radius:10px; font:700 .86rem 'DM Sans'; text-align:left; }
.me-menu button:hover, .me-menu button:active { background:var(--light); }
.me-menu svg { width:18px; height:18px; }
.me-menu .sep { border-top:1px solid var(--line); margin:6px 0; }
.me-menu .lock { color:var(--red); }

/* hero panels */
.hero { background:linear-gradient(135deg,#1c1a10,#0f1117); border:1px solid rgba(255,199,44,.35); border-radius:16px; padding:14px 14px 12px; margin-bottom:10px; }
.hero .row { align-items:flex-start; }
.hero .mo { font:800 1rem 'Syne'; color:var(--yellow); letter-spacing:1.2px; white-space:nowrap; }
.hero .sub { font-size:.68rem; color:rgba(255,255,255,.55); margin-top:2px; }
.hero .lbl { font:800 .58rem 'DM Sans'; letter-spacing:1px; color:var(--yellow); text-transform:uppercase; text-align:right; }
.hero .big { font:800 1.45rem 'DM Sans'; color:#4ade80; text-align:right; }
.hero .big small { font-size:.6rem; color:rgba(255,255,255,.6); margin-left:3px; }
.bar { height:5px; background:rgba(255,255,255,.1); border-radius:3px; margin-top:10px; overflow:hidden; } .bar div { height:100%; background:var(--yellow); }
.panel { display:grid; grid-template-columns:1fr 1fr; gap:10px 8px; background:rgba(255,255,255,.04); border:1px solid rgba(255,255,255,.12); border-radius:14px; padding:12px; }
.panel h4 { font:800 .56rem 'DM Sans'; color:var(--yellow); text-transform:uppercase; letter-spacing:.9px; margin-bottom:4px; }
.panel p { font:800 .98rem 'DM Sans'; color:#fff; }
.panel .r { text-align:right; }
.panel .muted2 { font-size:.64rem; color:rgba(255,255,255,.5); margin-top:2px; }

main { max-width:520px; margin:0 auto; padding:16px 16px 120px; }
.sec { font:800 .66rem 'DM Sans'; letter-spacing:1.1px; text-transform:uppercase; color:var(--gray); margin:18px 2px 8px; display:flex; justify-content:space-between; align-items:center; }
.sec:first-child { margin-top:0; }
.sec a { color:var(--blue); letter-spacing:.3px; cursor:pointer; }
.card { background:#fff; border:1px solid var(--line); border-radius:16px; padding:14px; margin-bottom:10px; box-shadow:0 2px 8px rgba(0,0,0,.03); }
.muted { color:var(--gray); font-size:.8rem; }
.row { display:flex; justify-content:space-between; align-items:center; gap:10px; }
.g2 { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
.stat-card { background:#fff; padding:14px; border-radius:16px; border-left:4px solid var(--blue); box-shadow:0 2px 8px rgba(0,0,0,.04); }
.stat-card h4 { font-size:.6rem; color:var(--gray); text-transform:uppercase; letter-spacing:.6px; margin-bottom:6px; }
.stat-card p { font:800 1rem 'DM Sans'; }
.cta { width:100%; border:0; border-radius:16px; padding:16px; font:800 .92rem 'DM Sans'; letter-spacing:1.2px; text-transform:uppercase; color:#fff; background:var(--blue); box-shadow:0 8px 20px rgba(26,86,219,.28); display:flex; align-items:center; justify-content:center; gap:10px; }
.cta.green { background:var(--pos); box-shadow:0 8px 20px rgba(0,135,90,.28); }
.cta.yellow { background:var(--yellow); color:var(--ink); box-shadow:0 8px 20px rgba(255,199,44,.28); }
.cta:disabled { opacity:.5; }
.btn-sec { flex:1; padding:13px 10px; border-radius:12px; border:1px solid var(--line); background:#fff; font:800 .74rem 'DM Sans'; letter-spacing:.6px; text-transform:uppercase; display:flex; align-items:center; justify-content:center; gap:8px; }
.btn-sec.blue { border-color:#bfd0f7; color:var(--blue); } .btn-sec.red { border-color:#f5c2c2; color:var(--red); }
.btn-sm { border:0; border-radius:10px; padding:9px 13px; font:800 .72rem 'DM Sans'; letter-spacing:.6px; text-transform:uppercase; background:var(--blue); color:#fff; }
.btn-sm.green { background:var(--pos); } .btn-sm.ghost { background:var(--light); color:var(--ink); }
.x { width:32px; height:32px; border-radius:50%; border:0; background:var(--light); display:inline-flex; align-items:center; justify-content:center; flex-shrink:0; }
.x svg { width:15px; height:15px; }

/* barber cards */
.bcard { background:#fff; border-radius:16px; padding:14px; border-left:4px solid var(--blue); box-shadow:0 2px 8px rgba(0,0,0,.04); }
.bcard .nm { font-weight:800; }
.bcard .rule { font-size:.66rem; color:var(--gray); text-transform:uppercase; letter-spacing:.4px; }
.bcard .count { font:800 2rem 'DM Sans'; line-height:1.05; margin-top:8px; }
.bcard .count small { font:700 .7rem 'DM Sans'; color:var(--gray); text-transform:uppercase; letter-spacing:.6px; margin-left:4px; }
.bcard .earn { display:flex; justify-content:space-between; align-items:center; margin-top:10px; padding-top:10px; border-top:1px solid var(--line); font-size:.78rem; }
.bcard .earn b { color:var(--pos); }

/* POS */
.chairs { display:flex; gap:8px; overflow-x:auto; scrollbar-width:none; padding-bottom:2px; }
.chair { flex-shrink:0; display:flex; align-items:center; gap:8px; background:rgba(255,255,255,.06); border:1.5px solid rgba(255,255,255,.14); color:#fff; border-radius:999px; padding:5px 14px 5px 5px; font:800 .8rem 'DM Sans'; }
.chair .av { width:28px; height:28px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:.78rem; color:#fff; }
.chair.on { background:var(--yellow); color:var(--ink); border-color:var(--yellow); }
.chair .busy { width:7px; height:7px; border-radius:50%; background:var(--amber); }
.hdr-line { display:flex; justify-content:space-between; align-items:center; font-size:.74rem; color:rgba(255,255,255,.6); margin-bottom:12px; }
.hdr-line b { color:var(--yellow); }
.pill-btn { display:inline-flex; align-items:center; gap:6px; border-radius:999px; padding:8px 13px; font:800 .7rem 'DM Sans'; letter-spacing:.6px; text-transform:uppercase; border:0; background:#232a3a; color:#fff; }
.pill-btn.yel { background:var(--yellow); color:var(--ink); }
.tiles { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
.tile { background:#fff; border:2px solid transparent; border-radius:16px; padding:14px; text-align:left; position:relative; box-shadow:0 2px 8px rgba(0,0,0,.04); min-height:92px; }
.tile b { display:block; font-size:.92rem; margin-bottom:4px; padding-right:26px; }
.tile .p { color:var(--pos); font-weight:800; font-size:.86rem; }
.tile .s { font-size:.72rem; color:var(--gray); margin-top:3px; }
.tile.on { border-color:var(--pos); background:#effaf5; }
.tile .q { position:absolute; top:10px; right:10px; background:var(--pos); color:#fff; border-radius:999px; min-width:26px; height:26px; display:flex; align-items:center; justify-content:center; font-weight:800; font-size:.8rem; }
.tile.out { opacity:.45; }
.ticket { position:fixed; left:16px; right:16px; bottom:calc(16px + env(safe-area-inset-bottom)); max-width:488px; margin:0 auto; background:var(--ink); color:#fff; border-radius:18px; padding:12px 16px; display:flex; align-items:center; gap:12px; z-index:30; box-shadow:0 14px 34px rgba(0,0,0,.35); border:0; text-align:left; }
.ticket .n { width:34px; height:34px; border-radius:50%; background:var(--yellow); color:var(--ink); display:flex; align-items:center; justify-content:center; font-weight:800; flex-shrink:0; }
.ticket .t1 { font:800 .78rem 'DM Sans'; letter-spacing:1px; text-transform:uppercase; }
.ticket .t2 { font-size:.68rem; color:#9aa3b6; }
.ticket .tot { margin-left:auto; font:800 1.05rem 'DM Sans'; color:var(--yellow); white-space:nowrap; }

/* lists */
.li { display:flex; align-items:center; gap:10px; padding:11px 0; border-bottom:1px solid var(--line); }
.li:last-child { border-bottom:0; }
.li .mx { flex:1; min-width:0; } .li .mx b { display:block; font-size:.9rem; }
.dot { width:36px; height:36px; border-radius:50%; flex-shrink:0; display:flex; align-items:center; justify-content:center; color:#fff; font-weight:800; font-size:.85rem; }
.tag { display:inline-block; border-radius:6px; padding:2px 7px; font:800 .6rem 'DM Sans'; letter-spacing:.5px; text-transform:uppercase; }
.tag.v { background:#fee2e2; color:var(--red); }
.empty { text-align:center; color:var(--gray); padding:22px 10px; font-size:.85rem; }
.chips { display:flex; gap:8px; flex-wrap:wrap; }
.chip { border:1px solid var(--line); background:#fff; border-radius:999px; padding:8px 14px; font:800 .74rem 'DM Sans'; }
.chip.on { background:var(--ink); color:#fff; border-color:var(--ink); }
.qstats { display:grid; grid-template-columns:repeat(3,1fr); gap:8px; }
.qstats div { background:rgba(255,255,255,.05); border:1px solid rgba(255,255,255,.12); border-radius:12px; padding:9px 10px; }
.qstats h4 { font:800 .56rem 'DM Sans'; letter-spacing:.8px; color:#9aa3b6; text-transform:uppercase; }
.qstats p { font:800 1.1rem 'DM Sans'; color:#fff; margin-top:2px; }
.page-title { font:800 1.05rem 'Syne'; letter-spacing:2px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; min-width:0; color:var(--yellow); text-transform:uppercase; }

/* forms + modal (Keep style) */
label.f { display:block; font:800 .62rem 'DM Sans'; letter-spacing:1px; text-transform:uppercase; color:var(--gray); margin:12px 0 6px; }
.in { width:100%; border:1.5px solid var(--line); border-radius:12px; padding:12px 13px; background:#fafbfc; outline:none; }
.in:focus { border-color:var(--blue); background:#fff; }
.seg { display:flex; background:var(--light); border-radius:12px; padding:4px; gap:4px; }
.seg button { flex:1; border:0; background:none; border-radius:9px; padding:10px 6px; font:800 .72rem 'DM Sans'; letter-spacing:.4px; color:var(--gray); text-transform:uppercase; }
.seg button.on { background:#fff; color:var(--ink); box-shadow:0 1px 4px rgba(0,0,0,.1); }
.ov { position:fixed; inset:0; background:rgba(11,13,18,.6); z-index:60; display:flex; align-items:flex-end; justify-content:center; }
.modal { background:#fff; width:100%; max-width:520px; max-height:92vh; overflow:auto; border-radius:24px 24px 0 0; padding:20px 18px calc(22px + env(safe-area-inset-bottom)); animation:up .18s ease-out; }
@keyframes up { from { transform:translateY(30px); opacity:.6; } to { transform:none; opacity:1; } }
.modal-title { font:800 1.1rem 'Syne'; text-align:center; margin-bottom:14px; }
.tot-line { display:flex; justify-content:space-between; align-items:center; background:var(--ink); color:#fff; border-radius:14px; padding:14px 16px; margin:14px 0 4px; }
.tot-line span { font:800 .66rem 'DM Sans'; letter-spacing:1px; text-transform:uppercase; color:#9aa3b6; }
.tot-line b { font:800 1.3rem 'DM Sans'; color:var(--yellow); }
.toast { position:fixed; left:50%; transform:translateX(-50%); bottom:calc(96px + env(safe-area-inset-bottom)); background:var(--ink); color:#fff; padding:12px 18px; border-radius:12px; font-weight:700; font-size:.86rem; z-index:99; max-width:90vw; text-align:center; box-shadow:0 10px 30px rgba(0,0,0,.3); }
.toast.err { background:var(--red); }
.note { background:#fff8e1; border-left:4px solid var(--yellow); padding:11px 12px; border-radius:10px; font-size:.8rem; margin-bottom:12px; }
.check { display:flex; gap:10px; align-items:center; margin-top:14px; font-weight:700; font-size:.88rem; }
.check input { width:20px; height:20px; }
.back { display:inline-flex; align-items:center; gap:6px; background:none; border:0; color:rgba(255,255,255,.7); font:800 .7rem 'DM Sans'; letter-spacing:1px; text-transform:uppercase; padding:0; margin-bottom:10px; }

/* first run */
.login { min-height:100vh; background:var(--ink); display:flex; align-items:center; justify-content:center; padding:24px 16px; }
.login-card { background:#fff; border-radius:24px; padding:28px 22px; width:100%; max-width:420px; }
.login-logo { font:800 2rem 'Syne'; letter-spacing:6px; text-align:center; }
.login-sub { text-align:center; color:var(--blue); font:800 .7rem 'DM Sans'; letter-spacing:2.5px; text-transform:uppercase; margin:4px 0 18px; }
</style>
</head>
<body>
<div id="app"></div>

<script>
'use strict';
// ════════════════════════════════════════════════════════════
//  Keep · Barbershop module (pilot)
//  Barbers are paid by the clients they serve. Records are kept on
//  this device (localStorage) with backup / restore, until the module
//  moves onto Keep's cloud.
// ════════════════════════════════════════════════════════════
const KEY = 'keep.barbershop.v1', APP_VERSION = 1;
const COLORS = ['#1a56db', '#00875a', '#7c3aed', '#dc2626', '#f59e0b', '#0891b2', '#db2777', '#4b5563'];
const ICON = {
    dash: '<path d="M3 3v18h18"/><path d="M7 15l4-4 3 3 5-6"/>',
    cut: '<circle cx="6" cy="6" r="3"/><circle cx="6" cy="18" r="3"/><path d="M20 4L8.12 15.88M14.47 14.48L20 20M8.12 8.12L12 12"/>',
    queue: '<path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/>',
    report: '<path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6M8 13h8M8 17h5"/>',
    team: '<circle cx="12" cy="8" r="4"/><path d="M4 21v-1a6 6 0 0 1 6-6h4a6 6 0 0 1 6 6v1"/>',
    list: '<path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/>',
    wallet: '<rect x="2" y="6" width="20" height="14" rx="2"/><path d="M2 10h20M16 15h2"/>',
    book: '<path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20V3H6.5A2.5 2.5 0 0 0 4 5.5z"/><path d="M4 19.5V21h16"/>',
    gear: '<circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.820-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>',
    save: '<path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M7 10l5 5 5-5M12 15V3"/>',
    lock: '<rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/>',
    unlock: '<rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 9.9-1"/>',
    x: '<path d="M18 6L6 18M6 6l12 12"/>',
    caret: '<path d="M6 9l6 6 6-6"/>',
    back: '<path d="M15 18l-6-6 6-6"/>',
    plus: '<path d="M12 5v14M5 12h14"/>',
    wa: '<path d="M21 11.5a8.4 8.4 0 0 1-12.4 7.4L3 21l2.1-5.4A8.4 8.4 0 1 1 21 11.5z"/>',
    check: '<path d="M20 6L9 17l-5-5"/>'
};
const ic = (k, st = '') => `<svg class="ic" viewBox="0 0 24 24" style="${st}">${ICON[k]}</svg>`;

// ── state ──
let D = load();
const U = { tab: 'dash', view: null, job: blankJob(), owner: false, ownerAt: 0, rp: 'today', qBarber: '', cq: '' };
function blankJob() { return { barberId: null, items: {}, customer: { name: '', phone: '' }, discount: 0, queueId: null }; }
function load() {
    try { const d = JSON.parse(localStorage.getItem(KEY) || 'null'); if (d && d.v === 1) return d; } catch (e) {}
    return { v: 1, shop: { name: '', phone: '', address: '', footer: '', pin: '' }, barbers: [], services: [], products: [], customers: [], jobs: [], queue: [], expenses: [], payouts: [], seq: 0 };
}
function persist() { try { localStorage.setItem(KEY, JSON.stringify(D)); return true; } catch (e) { toast('Storage is full — download a backup now', true); return false; } }

// ── helpers ──
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const n0 = v => Math.round(Number(v) || 0).toLocaleString('en-US');
const num = v => { const n = parseFloat(String(v ?? '').replace(/,/g, '')); return isFinite(n) ? n : 0; };
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const dayStr = (d = new Date()) => d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
const tm = ms => new Date(ms).toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit' });
const normPhone = p => { let x = String(p || '').replace(/\D/g, ''); if (x.startsWith('0')) x = '255' + x.slice(1); if (x.length === 9) x = '255' + x; return x; };
const pretty = p => { const x = normPhone(p); return x.startsWith('255') && x.length === 12 ? '0' + x.slice(3, 6) + ' ' + x.slice(6, 9) + ' ' + x.slice(9) : (p || ''); };
const barber = id => D.barbers.find(b => b.id === id);
const initial = s => (String(s || '?').trim()[0] || '?').toUpperCase();
const MONTHS = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];
function toast(m, err) { document.querySelectorAll('.toast').forEach(x => x.remove()); const e = document.createElement('div'); e.className = 'toast' + (err ? ' err' : ''); e.textContent = m; document.body.appendChild(e); setTimeout(() => e.remove(), err ? 3800 : 2200); }
function modal(html) { closeModal(); const o = document.createElement('div'); o.className = 'ov'; o.id = 'ov'; o.innerHTML = `<div class="modal">${html}</div>`; o.onclick = e => { if (e.target === o) closeModal(); }; document.body.appendChild(o); return o; }
function closeModal() { const o = $('ov'); if (o) o.remove(); }
function confirmBox(msg, yes, cb) { modal(`<div class="modal-title">${esc(msg)}</div><div class="g2"><button class="btn-sec" onclick="closeModal()">Cancel</button><button class="btn-sec red" id="cfYes">${esc(yes)}</button></div>`); $('cfYes').onclick = () => { closeModal(); cb(); }; }
function segPick(el) { el.parentNode.querySelectorAll('button').forEach(b => b.classList.toggle('on', b === el)); }

// ── pay rules: barbers are paid by the clients they serve ──
const PAYTYPES = [['head', 'Per client'], ['service', 'Per service'], ['pct', 'Percentage'], ['rent', 'Chair rent']];
function payDesc(b) { const ty = b.payType || 'pct'; return ty === 'head' ? n0(b.perHead) + ' per client' : ty === 'rent' ? 'Chair rent ' + n0(b.rent) + '/day' : ty === 'service' ? 'Per service' : (b.pct || 0) + '% of service'; }
// what the barber earns from one job (services only; products stay with the shop)
function jobPay(b, svcGross, disc, items) {
    const ty = b.payType || 'pct', svcNet = Math.max(0, svcGross - disc);
    if (ty === 'head') return Math.min(svcNet, Math.round(b.perHead || 0));
    if (ty === 'service') return Math.min(svcNet, items.filter(i => i.t === 's').reduce((a, i) => { const s = D.services.find(x => x.id === i.id); return a + (s && s.cut ? s.cut : 0) * i.qty; }, 0));
    if (ty === 'rent') return svcNet;            // keeps the service money, pays chair rent for each day worked
    return Math.round(svcNet * (b.pct || 0) / 100);
}

// ── owner PIN ──
async function sha(s) { try { const b = await crypto.subtle.digest('SHA-256', new TextEncoder().encode('keep-barbershop:' + s)); return [...new Uint8Array(b)].map(x => x.toString(16).padStart(2, '0')).join(''); } catch (e) { return 'p:' + s; } }
function isOwner() { if (U.owner && Date.now() - U.ownerAt > 15 * 60 * 1000) U.owner = false; return U.owner || !D.shop.pin; }
function askPin(ok) {
    if (!D.shop.pin) { ok(); return; }
    modal(`<div class="modal-title">Owner PIN</div><input class="in" id="pinIn" type="password" inputmode="numeric" maxlength="8" autocomplete="off" style="font-size:1.5rem;letter-spacing:8px;text-align:center;">
      <button class="cta" style="margin-top:14px;" id="pinGo">Unlock</button>`);
    const go = async () => { if (await sha($('pinIn').value) === D.shop.pin) { U.owner = true; U.ownerAt = Date.now(); closeModal(); ok(); } else { toast('Wrong PIN', true); $('pinIn').value = ''; } };
    $('pinGo').onclick = go; $('pinIn').onkeydown = e => { if (e.key === 'Enter') go(); }; setTimeout(() => $('pinIn').focus(), 60);
}
function ownerGate(fn) { closeMe(); if (isOwner()) { U.ownerAt = Date.now(); fn(); } else askPin(fn); }

// ── shell ──
function go(tab) { U.tab = tab; U.view = null; closeMe(); render(); window.scrollTo(0, 0); }
function openView(view) { U.view = view; closeMe(); render(); window.scrollTo(0, 0); }
function meChip() { const own = isOwner(); return `<button class="me-chip ${own ? '' : 'staff'}" onclick="openMe(event)"><span class="me-av">${own ? esc(initial(D.shop.name)) : ic('lock', 'width:13px;height:13px')}</span>${own ? 'Owner' : 'Staff'}${ic('caret', 'width:14px;height:14px;opacity:.7')}</button>`; }
function render() {
    if (!D.shop.name) return renderSetup();
    const q = D.queue.length;
    const tabs = [['dash', 'dash', 'Dashboard'], ['pos', 'cut', 'Point of sale'], ['queue', 'queue', 'Queue']];
    const views = { reports: renderReports, team: renderTeam, catalog: renderCatalog, expenses: renderExpenses, clients: renderClients, shop: renderShop, backup: renderBackup };
    $('app').innerHTML = `<nav class="tabbar">${tabs.map(([k, i, l]) => `<button class="${U.tab === k && !U.view ? 'on' : ''}" onclick="go('${k}')">${ic(i)}${l}${k === 'queue' && q ? `<span class="badge">${q}</span>` : ''}</button>`).join('')}</nav><div id="page"></div>`;
    if (U.view && views[U.view]) return views[U.view]();
    ({ dash: renderDash, pos: renderPOS, queue: renderQueue })[U.tab]();
}
function header(title, extra = '', mod = '') {
    return `<div class="hdr"><div class="hdr-top"><div class="logo">${mod ? `<span class="mod">${mod} · </span>` : ''}${esc(title)}</div>${meChip()}</div>${extra}</div>`;
}
function openMe(e) {
    e.stopPropagation(); if ($('meMenu')) return closeMe();
    const own = isOwner(), m = document.createElement('div'); m.className = 'me-menu'; m.id = 'meMenu';
    const it = (i, l, fn, cls = '') => `<button class="${cls}" onclick="${fn}">${ic(i)}${l}</button>`;
    m.innerHTML = `<div class="mm-head"><span class="me-av">${esc(initial(D.shop.name))}</span><div><b>${esc(D.shop.name)}</b><div class="mm-sub">${own ? 'Owner' : 'Staff'} · Barbershop</div></div></div>
      ${it('report', 'Reports', "ownerGate(()=>openView('reports'))")}${it('team', 'Barbers &amp; pay', "ownerGate(()=>openView('team'))")}${it('list', 'Services &amp; products', "ownerGate(()=>openView('catalog'))")}
      ${it('wallet', 'Expenses', "ownerGate(()=>openView('expenses'))")}${it('book', 'Clients', "openView('clients')")}${it('gear', 'Shop settings', "ownerGate(()=>openView('shop'))")}${it('save', 'Backup', "ownerGate(()=>openView('backup'))")}
      ${D.shop.pin ? '<div class="sep"></div>' + (own ? it('lock', 'Lock (staff mode)', 'lockOwner()', 'lock') : it('unlock', 'Owner unlock', 'ownerGate(render)')) : ''}`;
    document.body.appendChild(m); setTimeout(() => document.addEventListener('click', meOutside), 0);
}
function meOutside(e) { const m = $('meMenu'); if (m && !m.contains(e.target)) closeMe(); }
function closeMe() { const m = $('meMenu'); if (m) m.remove(); document.removeEventListener('click', meOutside); }
function lockOwner() { U.owner = false; closeMe(); if (U.view && U.view !== 'clients') U.view = null; render(); toast('Locked — staff mode'); }
const subHeader = title => `<div class="hdr"><button class="back" onclick="go(U.tab)">${ic('back', 'width:14px;height:14px')} Back</button><div class="hdr-top" style="margin-bottom:0"><div class="page-title">${esc(title)}</div>${meChip()}</div></div>`;

function suValLabel() { return { head: 'amount per client (TZS)', pct: 'percentage (%)', rent: 'chair rent per day (TZS)', service: '' }[U.suPay]; }
function suDrawBarbers() { const svc = U.suPay === 'service', ph = { head: '2,500', pct: '50', rent: '10,000' }[U.suPay];
    $('suBarbers').innerHTML = U.suB.map((b, i) => `<div style="display:grid;grid-template-columns:${svc ? '1fr' : '2fr 1fr'};gap:8px;margin-bottom:8px;"><input class="in" placeholder="Barber ${i + 1} name" value="${esc(b.name)}" oninput="U.suB[${i}].name=this.value">${svc ? '' : `<input class="in" type="number" inputmode="numeric" placeholder="${ph}" value="${esc(b.v)}" oninput="U.suB[${i}].v=this.value">`}</div>`).join(''); }
function suAddBarber() { U.suB.push({ name: '', v: '' }); suDrawBarbers(); }
async function finishSetup() {
    const name = $('suName').value.trim(), pin = $('suPin').value.trim(), ty = U.suPay;
    if (!name) return toast('Enter the shop name', true);
    if (!/^\d{4,8}$/.test(pin)) return toast('PIN must be 4–8 digits', true);
    const bs = U.suB.filter(b => b.name.trim());
    if (!bs.length) return toast('Add at least one barber', true);
    if (ty !== 'service' && bs.some(b => !(num(b.v) > 0))) return toast('Enter the ' + suValLabel() + ' for each barber', true);
    D.shop.name = name; D.shop.pin = await sha(pin);
    D.barbers = bs.map((b, i) => { const v = num(b.v); return { id: uid(), name: b.name.trim(), payType: ty, pct: ty === 'pct' ? Math.min(100, v) : 50, perHead: ty === 'head' ? v : 0, rent: ty === 'rent' ? v : 0, active: true, color: COLORS[i % COLORS.length] }; });
    D.services = U.suS.map(([n, p, m, c]) => ({ id: uid(), name: n, price: p, mins: m, cut: c, active: true }));
    persist(); U.owner = true; U.ownerAt = Date.now(); go('pos');
}

// ════════════ FIGURES ════════════
function fig(from, to) {
    const J = D.jobs.filter(j => !j.voided && j.day >= from && j.day <= to);
    const E = D.expenses.filter(e => e.day >= from && e.day <= to), P = D.payouts.filter(p => p.day >= from && p.day <= to);
    const f = { jobs: J.length, revenue: 0, cash: 0, mobile: 0, commission: 0, productCost: 0, productSales: 0, expenses: E.reduce((a, e) => a + e.amount, 0), payouts: P.reduce((a, p) => a + p.amount, 0), per: {}, svc: {}, J, E };
    const R = id => f.per[id] = f.per[id] || { jobs: 0, takings: 0, commission: 0, paid: 0, rent: 0 };
    J.forEach(j => {
        f.revenue += j.total; f.cash += j.cash; f.mobile += j.mobile; f.commission += j.commission;
        j.items.forEach(i => { if (i.t === 'p') { f.productCost += (i.cost || 0) * i.qty; f.productSales += i.price * i.qty; } else f.svc[i.name] = (f.svc[i.name] || 0) + i.qty; });
        const r = R(j.barberId); r.jobs++; r.takings += j.total; r.commission += j.commission;
    });
    // chair rent: charged for each day the barber worked
    D.barbers.forEach(b => { if (b.payType !== 'rent' || !b.rent) return; const days = new Set(J.filter(j => j.barberId === b.id).map(j => j.day)).size; if (!days) return; const r = R(b.id); r.rent = days * b.rent; r.commission -= r.rent; f.commission -= r.rent; });
    P.forEach(p => { R(p.barberId).paid += p.amount; });
    f.profit = f.revenue - f.commission - f.productCost - f.expenses;
    return f;
}
function owedAll(bid) { const r = fig('0000-00-00', '9999-99-99').per[bid]; return r ? r.commission - r.paid : 0; }

// ════════════ DASHBOARD ════════════
function renderDash() {
    const own = isOwner(), now = new Date(), d = dayStr(), f = fig(d, d);
    const mFrom = dayStr(new Date(now.getFullYear(), now.getMonth(), 1)), m = fig(mFrom, d), dim = new Date(now.getFullYear(), now.getMonth() + 1, 0).getDate(), mon = MONTHS[now.getMonth()];
    const yd = new Date(now - 864e5), fy = fig(dayStr(yd), dayStr(yd));
    const trend = fy.jobs ? Math.round((f.jobs - fy.jobs) / fy.jobs * 100) : null;
    const hero = own ? `<div class="hero"><div class="row"><div><div class="mo">${mon.toUpperCase()} ${now.getFullYear()}</div><div class="sub">Day ${now.getDate()} of ${dim} · ${m.jobs} clients this month</div></div>
        <div><div class="lbl">Profit so far</div><div class="big">${n0(m.profit)}<small>TZS</small></div></div></div><div class="bar"><div style="width:${Math.round(now.getDate() / dim * 100)}%"></div></div></div>` : '';
    const panel = `<div class="panel">
        <div><h4>Clients today</h4><p>${f.jobs}</p><div class="muted2">${trend === null ? 'No clients yesterday' : (trend >= 0 ? '▲ ' : '▼ ') + Math.abs(trend) + '% vs yesterday'}</div></div>
        <div class="r"><h4>Takings today</h4><p>${n0(f.revenue)} TZS</p><div class="muted2">${D.queue.filter(q => q.status === 'waiting').length} waiting in queue</div></div>
        <div><h4>Cash</h4><p>${n0(f.cash)}</p></div><div class="r"><h4>Mobile money</h4><p>${n0(f.mobile)}</p></div></div>`;
    const act = D.barbers.filter(b => b.active || f.per[b.id]);
    const cards = act.map(b => { const r = f.per[b.id] || { jobs: 0, takings: 0, commission: 0 }, due = own ? owedAll(b.id) : 0;
        return `<div class="bcard" style="border-left-color:${b.color}"><div class="nm">${esc(b.name)}</div><div class="rule">${esc(payDesc(b))}</div>
          <div class="count">${r.jobs}<small>client${r.jobs === 1 ? '' : 's'}</small></div><div class="muted">${n0(r.takings)} TZS taken</div>
          ${own ? `<div class="earn"><span>Earned today</span><b>${n0(r.commission)}</b></div>${due > 0 ? `<button class="btn-sm" style="width:100%;margin-top:10px;" onclick="payBarber('${b.id}')">Pay ${n0(due)}</button>` : ''}` : ''}</div>`; }).join('');
    const jobs = f.J.concat(D.jobs.filter(j => j.voided && j.day === d)).sort((a, b) => b.at - a.at).slice(0, 25);
    $('page').innerHTML = header(D.shop.name, hero + panel) + `<main>
      <button class="cta" onclick="go('pos')">${ic('cut')} New sale</button>
      <div class="sec" style="margin-top:20px;">Clients served today</div>
      <div class="g2">${cards || '<div class="empty">No barbers yet</div>'}</div>
      ${own ? `<div class="sec">${mon} so far</div><div class="g2">
        <div class="stat-card"><h4>Revenue · ${mon.slice(0, 3)}</h4><p>${n0(m.revenue)} TZS</p></div>
        <div class="stat-card" style="border-left-color:var(--amber)"><h4>Barber pay · ${mon.slice(0, 3)}</h4><p>${n0(m.commission)} TZS</p></div>
        <div class="stat-card" style="border-left-color:var(--red)"><h4>Costs · ${mon.slice(0, 3)}</h4><p>${n0(m.expenses + m.productCost)} TZS</p></div>
        <div class="stat-card" style="border-left-color:var(--yellow)"><h4>Profit · ${mon.slice(0, 3)}</h4><p style="color:var(--pos)">${n0(m.profit)} TZS</p></div></div>
      <div style="display:flex;gap:10px;margin-top:12px;"><button class="btn-sec blue" onclick="openView('reports')">${ic('report', 'width:16px;height:16px')} Reports</button><button class="btn-sec" onclick="openView('expenses')">${ic('wallet', 'width:16px;height:16px')} Expenses</button></div>` : ''}
      <div class="sec">Today's sales</div>
      <div class="card" style="padding:4px 14px;">${jobs.map(j => `<div class="li"><div class="dot" style="background:${(barber(j.barberId) || {}).color || '#9ca3af'}">${esc(initial(j.barberName))}</div>
          <div class="mx"><b>${esc(j.items.map(i => i.name + (i.qty > 1 ? ' ×' + i.qty : '')).join(', '))}</b><span class="muted">${tm(j.at)} · ${esc(j.barberName)}${j.customerName ? ' · ' + esc(j.customerName) : ''} ${j.voided ? '<span class="tag v">Void</span>' : ''}</span></div>
          <b style="font-size:.9rem;${j.voided ? 'text-decoration:line-through;color:var(--gray)' : ''}">${n0(j.total)}</b>
          ${!j.voided ? `<button class="x" title="Receipt" onclick="sendReceipt('${j.id}')">${ic('wa')}</button>${own ? `<button class="x" title="Void" onclick="voidJob('${j.id}')">${ic('x')}</button>` : ''}` : ''}</div>`).join('') || '<div class="empty">No sales yet today.</div>'}</div>
    </main>`;
}
function voidJob(id) { ownerGate(() => confirmBox('Void this sale? It will be removed from takings and barber pay.', 'Void sale', () => {
    const j = D.jobs.find(x => x.id === id); if (!j || j.voided) return; j.voided = true; j.voidedAt = Date.now();
    j.items.forEach(i => { if (i.t === 'p') { const p = D.products.find(y => y.id === i.id); if (p) p.stock += i.qty; } });
    const c = D.customers.find(x => x.id === j.customerId); if (c) { c.visits = Math.max(0, c.visits - 1); c.spent = Math.max(0, c.spent - j.total); }
    persist(); render(); toast('Sale voided'); })); }

// ════════════ POINT OF SALE ════════════
const jobTotals = () => {
    let sub = 0, svc = 0;
    Object.entries(U.job.items).forEach(([k, q]) => { const [ty, id] = k.split(':'); const it = ty === 's' ? D.services.find(x => x.id === id) : D.products.find(x => x.id === id); if (it) { sub += it.price * q; if (ty === 's') svc += it.price * q; } });
    const disc = Math.min(sub, Math.max(0, U.job.discount || 0));
    return { sub, svc, disc, total: sub - disc };
};
function renderPOS() {
    const d = dayStr(), f = fig(d, d), busy = new Set(D.queue.filter(q => q.status === 'chair').map(q => q.barberId)), items = U.job.items;
    const act = D.barbers.filter(b => b.active), wait = D.queue.filter(q => q.status === 'waiting').length;
    const extra = `<div class="hdr-line"><span>Today: <b>${f.jobs}</b> clients · <b>${n0(f.revenue)} TZS</b></span><button class="pill-btn ${wait ? 'yel' : ''}" onclick="go('queue')">${ic('queue', 'width:14px;height:14px')} Queue${wait ? ' · ' + wait : ''}</button></div>
      <div class="chairs">${act.map(b => `<button class="chair ${U.job.barberId === b.id ? 'on' : ''}" onclick="pickBarber('${b.id}')"><span class="av" style="background:${b.color}">${esc(initial(b.name))}</span>${esc(b.name)}${busy.has(b.id) ? '<span class="busy" title="In chair"></span>' : ''}</button>`).join('')}</div>`;
    $('page').innerHTML = header(D.shop.name, extra, 'POS') + `<main>
      ${!U.job.barberId ? `<div class="note">Choose the barber who served the client, then tap the services.</div>` : ''}
      <div class="sec">Services</div>
      <div class="tiles">${D.services.filter(s => s.active).map(s => { const q = items['s:' + s.id] || 0; return `<button class="tile ${q ? 'on' : ''}" onclick="addItem('s','${s.id}')">${q ? `<span class="q">${q}</span>` : ''}<b>${esc(s.name)}</b><span class="p">${n0(s.price)} TZS</span>${s.mins ? `<div class="s">${s.mins} min</div>` : ''}</button>`; }).join('')}</div>
      ${D.products.some(p => p.active) ? `<div class="sec">Products</div><div class="tiles">${D.products.filter(p => p.active).map(p => { const q = items['p:' + p.id] || 0; return `<button class="tile ${q ? 'on' : ''} ${p.stock <= 0 ? 'out' : ''}" onclick="addItem('p','${p.id}')" ${p.stock <= 0 ? 'disabled' : ''}>${q ? `<span class="q">${q}</span>` : ''}<b>${esc(p.name)}</b><span class="p">${n0(p.price)} TZS</span><div class="s">${p.stock <= 0 ? 'Out of stock' : p.stock + ' left'}</div></button>`; }).join('')}</div>` : ''}
    </main><div id="ticketWrap"></div>`;
    drawTicket();
}
function pickBarber(id) { U.job.barberId = U.job.barberId === id ? null : id; renderPOS(); }
function addItem(ty, id) {
    const k = ty + ':' + id, cur = U.job.items[k] || 0;
    if (ty === 'p') { const p = D.products.find(x => x.id === id); if (!p || cur >= p.stock) return toast('Not enough stock', true); }
    U.job.items[k] = cur + 1; renderPOS();
}
function drawTicket() {
    const n = Object.values(U.job.items).reduce((a, b) => a + b, 0), x = jobTotals(), w = $('ticketWrap'); if (!w) return;
    if (!n) { w.innerHTML = ''; return; }
    const b = barber(U.job.barberId), names = Object.keys(U.job.items).map(k => { const [ty, id] = k.split(':'); return ((ty === 's' ? D.services : D.products).find(i => i.id === id) || {}).name; }).filter(Boolean);
    w.innerHTML = `<button class="ticket" onclick="openCheckout()"><span class="n">${n}</span><div><div class="t1">View ticket</div><div class="t2">${b ? esc(b.name) + ' · ' : 'No barber · '}${esc(names.slice(0, 2).join(', '))}${names.length > 2 ? ' +' + (names.length - 2) + ' more' : ''}</div></div><span class="tot">${n0(x.total)} TZS</span></button>`;
}
function openCheckout() {
    if (!U.job.barberId) return toast('Choose the barber first', true);
    if (!Object.keys(U.job.items).length) return toast('Add a service or product', true);
    const x = jobTotals(), b = barber(U.job.barberId);
    const lines = Object.entries(U.job.items).map(([k, q]) => { const [ty, id] = k.split(':'); const it = ty === 's' ? D.services.find(s => s.id === id) : D.products.find(p => p.id === id); return it ? `<div class="li"><div class="mx"><b>${esc(it.name)}</b><span class="muted">${q} × ${n0(it.price)}</span></div><b>${n0(it.price * q)}</b><button class="x" onclick="decItem('${k}')">−</button></div>` : ''; }).join('');

function coRecalc() { U.job.discount = num($('coDisc').value); const x = jobTotals(); $('coTot').textContent = n0(x.total) + ' TZS'; if (num($('coMob').value) > x.total) $('coMob').value = x.total; $('coCash').value = Math.max(0, x.total - num($('coMob').value)); }

function saveJob() {

    }

    D.jobs.push(job);

function receiptText(j) {
    const L = [`*${D.shop.name.toUpperCase()}*`]; if (D.shop.address) L.push(D.shop.address); if (D.shop.phone) L.push('Tel: ' + pretty(D.shop.phone));

      <button class="cta green" style="margin-top:16px;" id="esSave">Save</button>`);
    $('esSave').onclick = () => { const name = $('esName').value.trim(), price = num($('esPrice').value); if (!name || !(price > 0)) return toast('Enter a name and price', true);
        const v = { name, price, mins: num($('esMins').value), cut: Math.min(price, Math.max(0, num($('esCut').value))), active: $('esAct').checked };
        if (id) Object.assign(s, v); else D.services.push({ id: uid(), ...v }); persist(); closeModal(); render(); toast('Saved'); };
}
function editProduct(id) {
    const p = id ? D.products.find(x => x.id === id) : { name: '', price: 0, cost: 0, stock: 0, active: true };
    modal(`<div class="modal-title">${id ? esc(p.name) : 'Add product'}</div><label class="f">Name</label><input class="in" id="epName" value="${esc(p.name)}">
      <div class="g2"><div><label class="f">Sell price</label><input class="in" id="epPrice" type="number" inputmode="numeric" value="${p.price || ''}"></div><div><label class="f">Cost price</label><input class="in" id="epCost" type="number" inputmode="numeric" value="${p.cost || ''}"></div></div>
      ${id ? `<div class="g2"><div><label class="f">In stock</label><input class="in" value="${p.stock}" disabled></div><div><label class="f">Add stock</label><input class="in" id="epAdd" type="number" inputmode="numeric" placeholder="+0"></div></div>`
           : `<label class="f">Opening stock</label><input class="in" id="epStock" type="number" inputmode="numeric" value="0">`}
      <label class="check"><input type="checkbox" id="epAct" ${p.active ? 'checked' : ''}> For sale (shows at the till)</label>
      <button class="cta green" style="margin-top:16px;" id="epSave">Save</button>`);
    $('epSave').onclick = () => { const name = $('epName').value.trim(), price = num($('epPrice').value); if (!name || !(price > 0)) return toast('Enter a name and price', true);
        const v = { name, price, cost: num($('epCost').value), active: $('epAct').checked };
        if (id) { Object.assign(p, v); p.stock += Math.round(num($('epAdd').value)); } else D.products.push({ id: uid(), ...v, stock: Math.round(num($('epStock').value)) });
        persist(); closeModal(); render(); toast('Saved'); };
}

// ════════════ EXPENSES ════════════
const CATS = [['rent', 'Rent'], ['power', 'Electricity (LUKU)'], ['water', 'Water'], ['supplies', 'Supplies'], ['salary', 'Salary'], ['other', 'Other']];
function renderExpenses() {
    if (!isOwner()) return go('dash');
    const L = [...D.expenses].sort((a, b) => b.at - a.at).slice(0, 60), cn = Object.fromEntries(CATS);
    $('page').innerHTML = subHeader('Expenses') + `<main><div class="card">
        <label class="f" style="margin-top:0">Type</label><select class="in" id="exCat">${CATS.map(([k, l]) => `<option value="${k}">${l}</option>`).join('')}</select>
        <div class="g2"><div><label class="f">Amount</label><input class="in" id="exAmt" type="number" inputmode="numeric"></div><div><label class="f">Paid from</label><select class="in" id="exFrom"><option value="cash">Cash</option><option value="mobile">Mobile money</option></select></div></div>
        <label class="f">Note</label><input class="in" id="exNote" placeholder="Optional">
        <button class="cta" style="margin-top:14px;" onclick="addExpense()">Add expense</button></div>
      <div class="sec">Recent</div><div class="card" style="padding:4px 14px;">${L.map(e => `<div class="li"><div class="mx"><b>${esc(cn[e.cat] || e.cat)}${e.note ? ' · ' + esc(e.note) : ''}</b><span class="muted">${e.day} · ${e.from === 'mobile' ? 'Mobile money' : 'Cash'}</span></div><b>${n0(e.amount)}</b><button class="x" onclick="delExpense('${e.id}')">${ic('x')}</button></div>`).join('') || '<div class="empty">No expenses yet.</div>'}</div></main>`;
}
function addExpense() { const amt = num($('exAmt').value); if (!(amt > 0)) return toast('Enter the amount', true); D.expenses.push({ id: uid(), day: dayStr(), at: Date.now(), cat: $('exCat').value, amount: amt, from: $('exFrom').value, note: $('exNote').value.trim() }); persist(); toast('Expense added'); renderExpenses(); }
function delExpense(id) { confirmBox('Delete this expense?', 'Delete', () => { D.expenses = D.expenses.filter(e => e.id !== id); persist(); renderExpenses(); }); }

// ════════════ CLIENTS ════════════
function renderClients() {
    const q = U.cq.toLowerCase();
    const L = D.customers.filter(c => !q || c.name.toLowerCase().includes(q) || (c.phone || '').includes(q)).sort((a, b) => b.lastVisit - a.lastVisit);
    $('page').innerHTML = subHeader('Clients') + `<main><input class="in" id="cq" placeholder="Search name or phone" value="${esc(U.cq)}" oninput="U.cq=this.value;renderClients();const e=$('cq');e.focus();e.setSelectionRange(e.value.length,e.value.length)">
      <div class="card" style="margin-top:10px;padding:4px 14px;">${L.map(c => `<div class="li" style="cursor:pointer;" onclick="clientDetail('${c.id}')"><div class="dot" style="background:var(--blue)">${esc(initial(c.name))}</div><div class="mx"><b>${esc(c.name)}</b><span class="muted">${c.phone ? pretty(c.phone) + ' · ' : ''}${c.visits} visit${c.visits === 1 ? '' : 's'}${c.lastVisit ? ' · last ' + new Date(c.lastVisit).toLocaleDateString('en-GB') : ''}</span></div>${isOwner() ? `<b>${n0(c.spent)}</b>` : ''}</div>`).join('') || '<div class="empty">Clients appear here when you add a name or phone at checkout.</div>'}</div></main>`;
}
function clientDetail(id) { const c = D.customers.find(x => x.id === id); if (!c) return;
    const J = D.jobs.filter(j => j.customerId === id && !j.voided).sort((a, b) => b.at - a.at).slice(0, 30);
    modal(`<div class="modal-title">${esc(c.name)}</div><p class="muted" style="text-align:center;margin-top:-8px;">${c.phone ? pretty(c.phone) + ' · ' : ''}${c.visits} visits</p>
      ${J.map(j => `<div class="li"><div class="mx"><b>${esc(j.items.map(i => i.name).join(', '))}</b><span class="muted">${j.day} · ${esc(j.barberName)}</span></div><b>${n0(j.total)}</b></div>`).join('') || '<div class="empty">No visits.</div>'}
      ${c.phone ? `<button class="cta" style="margin-top:14px;" onclick="window.openView('https://wa.me/${c.phone}','_blank')">${ic('wa')} WhatsApp</button>` : ''}`); }

// ════════════ SHOP SETTINGS ════════════
function renderShop() {
    if (!isOwner()) return go('dash');
    $('page').innerHTML = subHeader('Shop settings') + `<main><div class="card">
        <label class="f" style="margin-top:0">Shop name</label><input class="in" id="stName" value="${esc(D.shop.name)}">
        <div class="g2"><div><label class="f">Phone</label><input class="in" id="stPhone" inputmode="tel" value="${esc(D.shop.phone ? pretty(D.shop.phone) : '')}"></div><div><label class="f">New owner PIN</label><input class="in" id="stPin" type="password" inputmode="numeric" maxlength="8" placeholder="Unchanged"></div></div>
        <label class="f">Address</label><input class="in" id="stAddr" value="${esc(D.shop.address || '')}">
        <label class="f">Receipt message</label><input class="in" id="stFoot" value="${esc(D.shop.footer || '')}" placeholder="e.g. Open daily 8am – 10pm">
        <button class="cta" style="margin-top:16px;" onclick="saveShop()">Save</button></div>
      <p class="muted" style="text-align:center;">Keep · Barbershop v${APP_VERSION} · pilot</p></main>`;
}
async function saveShop() {
    const name = $('stName').value.trim(); if (!name) return toast('Enter the shop name', true);
    const pin = $('stPin').value.trim(); if (pin && !/^\d{4,8}$/.test(pin)) return toast('PIN must be 4–8 digits', true);
    D.shop.name = name; D.shop.phone = normPhone($('stPhone').value); D.shop.address = $('stAddr').value.trim(); D.shop.footer = $('stFoot').value.trim();
    if (pin) D.shop.pin = await sha(pin);
    persist(); render(); toast(pin ? 'Saved — new PIN set' : 'Saved');
}

// ════════════ BACKUP ════════════
function renderBackup() {
    if (!isOwner()) return go('dash');
    $('page').innerHTML = subHeader('Backup') + `<main><div class="note">During the pilot your records are kept on this phone. Download a backup every week and keep it somewhere safe — WhatsApp it to yourself, or save it to Google Drive or email.</div>
      <button class="cta" onclick="downloadBackup()">${ic('save')} Download backup</button>
      <button class="btn-sec" style="width:100%;margin-top:10px;padding:15px;" onclick="$('rsFile').click()">Restore from backup</button>
      <input type="file" id="rsFile" accept="application/json,.json" class="hidden" onchange="restoreBackup(this)">
      <div class="card" style="margin-top:14px;">${[['Sales', D.jobs.length], ['Clients', D.customers.length], ['Expenses', D.expenses.length], ['Last backup', D.lastBackup ? new Date(D.lastBackup).toLocaleString('en-GB') : 'Never']].map(([l, v]) => `<div class="row" style="padding:5px 0;"><span class="muted">${l}</span><b>${v}</b></div>`).join('')}</div></main>`;
}
function downloadBackup() { D.lastBackup = Date.now(); persist(); dl(new Blob([JSON.stringify({ app: 'keep-barbershop', madeAt: new Date().toISOString(), data: D })], { type: 'application/json' }), `Keep_Barbershop_backup_${dayStr()}.json`); renderBackup(); }
function restoreBackup(input) {
    const f = input.files && input.files[0]; input.value = ''; if (!f) return;
    const r = new FileReader(); r.onload = () => { try { const o = JSON.parse(r.result); if (o.app !== 'keep-barbershop' || !o.data || o.data.v !== 1) throw 0;
        confirmBox('Replace everything on this phone with this backup?', 'Restore', () => { D = o.data; persist(); go('dash'); toast('Backup restored'); }); } catch (e) { toast('This file is not a Keep Barbershop backup', true); } };
    r.readAsText(f);
}

// ── boot ──
render();
setInterval(() => { if (U.tab === 'queue' && !U.view && !$('ov') && !($('qName') && ($('qName').value || document.activeElement === $('qName')))) render(); }, 60000);
if ('serviceWorker' in navigator && location.protocol.startsWith('http')) navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
</body>
</html>
