<!doctype html>
<html lang="sw">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Keep Kinyozi</title>
<meta name="theme-color" content="#0b0d12">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="../icon-192.png">
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=DM+Sans:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root { --ink:#0b0d12; --ink2:#161b27; --blue:#1a56db; --yellow:#ffc72c; --green:#16a34a; --pos:#00875a; --red:#dc2626; --amber:#f59e0b; --light:#f2f4f8; --line:#e3e8ef; --gray:#6b7280; }
* { box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; }
html, body { height:100%; }
body { font-family:'DM Sans',system-ui,sans-serif; background:var(--light); color:var(--ink); font-size:15px; }
button { font-family:inherit; cursor:pointer; }
input, select { font-family:inherit; font-size:16px; }
.hidden { display:none !important; }
/* header */
.top { background:var(--ink); color:#fff; padding:calc(14px + env(safe-area-inset-top)) 16px 14px; position:sticky; top:0; z-index:20; display:flex; align-items:center; gap:10px; }
.top .shop { flex:1; min-width:0; font:800 16px 'Syne'; letter-spacing:.5px; color:var(--yellow); text-transform:uppercase; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.top .shop small { display:block; font:700 10px 'DM Sans'; letter-spacing:2px; color:#8f9bb3; }
.tbtn { background:rgba(255,255,255,.08); border:1px solid rgba(255,255,255,.14); color:#fff; border-radius:999px; height:34px; padding:0 12px; font:800 12px 'DM Sans'; display:inline-flex; align-items:center; gap:6px; }
.tbtn.on { background:var(--yellow); color:var(--ink); border-color:var(--yellow); }
main { padding:14px 14px 110px; max-width:760px; margin:0 auto; }
/* bottom nav */
nav.tabs { position:fixed; left:0; right:0; bottom:0; background:var(--ink); display:flex; padding:6px 6px calc(6px + env(safe-area-inset-bottom)); z-index:30; }
nav.tabs button { flex:1; background:none; border:0; color:#8f9bb3; padding:8px 2px; border-radius:12px; font:800 11px 'DM Sans'; letter-spacing:.5px; display:flex; flex-direction:column; align-items:center; gap:3px; text-transform:uppercase; position:relative; }
nav.tabs button .ic { font-size:21px; }
nav.tabs button.on { color:var(--yellow); background:rgba(255,199,44,.08); }
nav.tabs .badge { position:absolute; top:3px; right:calc(50% - 22px); background:var(--red); color:#fff; border-radius:999px; font-size:10px; min-width:18px; height:18px; display:flex; align-items:center; justify-content:center; padding:0 5px; }
/* blocks */
h2 { font:800 15px 'DM Sans'; letter-spacing:1.2px; text-transform:uppercase; color:var(--gray); margin:18px 2px 8px; display:flex; justify-content:space-between; align-items:center; }
h2:first-child { margin-top:4px; }
h2 a { color:var(--blue); text-transform:none; letter-spacing:0; font-size:13px; cursor:pointer; }
.card { background:#fff; border:1px solid var(--line); border-radius:16px; padding:14px; margin-bottom:10px; }
.muted { color:var(--gray); font-size:13px; }
.row { display:flex; justify-content:space-between; align-items:center; gap:10px; }
.grid2 { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
.grid3 { display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:10px; }
/* barbers */
.barbers { display:flex; gap:12px; overflow-x:auto; padding:2px 2px 8px; scrollbar-width:none; }
.barber { flex-shrink:0; width:78px; background:none; border:0; text-align:center; font:700 12px 'DM Sans'; color:var(--ink); }
.av { width:62px; height:62px; border-radius:50%; margin:0 auto 6px; display:flex; align-items:center; justify-content:center; font:800 24px 'Syne'; color:#fff; border:3px solid transparent; transition:transform .12s; }
.barber.on .av { border-color:var(--ink); box-shadow:0 0 0 3px var(--yellow); transform:scale(1.04); }
.barber .busy { font-size:10px; color:var(--amber); font-weight:800; }
/* tiles */
.tile { background:#fff; border:1.5px solid var(--line); border-radius:16px; padding:14px; text-align:left; position:relative; min-height:86px; }
.tile b { display:block; font-size:15px; margin-bottom:4px; }
.tile .p { color:var(--pos); font-weight:800; }
.tile .s { font-size:12px; color:var(--gray); }
.tile.on { border-color:var(--pos); background:#f0faf5; }
.tile .q { position:absolute; top:10px; right:10px; background:var(--pos); color:#fff; border-radius:999px; min-width:26px; height:26px; display:flex; align-items:center; justify-content:center; font-weight:800; font-size:13px; }
.tile.out { opacity:.45; }
/* forms */
label.f { display:block; font:800 11px 'DM Sans'; letter-spacing:1px; text-transform:uppercase; color:var(--blue); margin:10px 0 5px; }
input.i, select.i { width:100%; border:1.5px solid var(--line); border-radius:12px; padding:12px 13px; background:#fff; outline:none; }
input.i:focus, select.i:focus { border-color:var(--blue); }
.btn { width:100%; border:0; border-radius:14px; padding:15px; font:800 15px 'DM Sans'; letter-spacing:.5px; }
.btn.go { background:var(--pos); color:#fff; }
.btn.pri { background:var(--blue); color:#fff; }
.btn.yel { background:var(--yellow); color:var(--ink); }
.btn.sec { background:#fff; color:var(--ink); border:1.5px solid var(--line); }
.btn.red { background:#fff; color:var(--red); border:1.5px solid #f3c4c4; }
.btn:disabled { opacity:.45; }
.sm { padding:9px 12px; border-radius:10px; font-size:13px; width:auto; }
.seg { display:flex; background:#fff; border:1.5px solid var(--line); border-radius:12px; padding:3px; gap:3px; }
.seg button { flex:1; border:0; background:none; border-radius:9px; padding:10px 6px; font:800 13px 'DM Sans'; color:var(--gray); }
.seg button.on { background:var(--ink); color:#fff; }
/* summary bar */
.sumbar { position:fixed; left:12px; right:12px; bottom:calc(76px + env(safe-area-inset-bottom)); background:var(--ink); color:#fff; border-radius:18px; padding:12px 14px; display:flex; align-items:center; gap:12px; z-index:25; box-shadow:0 14px 34px rgba(0,0,0,.3); max-width:736px; margin:0 auto; }
.sumbar .tot { font:800 20px 'DM Sans'; }
.sumbar .lbl { font-size:12px; color:#aeb8cc; }
.sumbar button { margin-left:auto; background:var(--yellow); color:var(--ink); border:0; border-radius:12px; padding:12px 16px; font:800 14px 'DM Sans'; }
/* stats */
.stat { background:var(--ink); color:#fff; border-radius:16px; padding:14px; }
.stat .k { font:800 11px 'DM Sans'; letter-spacing:1.2px; text-transform:uppercase; color:#8f9bb3; }
.stat .v { font:800 22px 'DM Sans'; margin-top:4px; }
.stat .v.y { color:var(--yellow); } .stat .v.g { color:#4ade80; }
table.t { width:100%; border-collapse:collapse; font-size:14px; }
table.t th { text-align:left; font:800 11px 'DM Sans'; letter-spacing:1px; text-transform:uppercase; color:var(--gray); padding:6px 4px; border-bottom:1.5px solid var(--line); }
table.t td { padding:9px 4px; border-bottom:1px solid var(--line); }
table.t td.n, table.t th.n { text-align:right; }
.li { display:flex; align-items:center; gap:10px; padding:11px 2px; border-bottom:1px solid var(--line); }
.li:last-child { border-bottom:0; }
.li .mx { flex:1; min-width:0; }
.li .mx b { display:block; }
.dot { width:36px; height:36px; border-radius:50%; flex-shrink:0; display:flex; align-items:center; justify-content:center; color:#fff; font:800 15px 'Syne'; }
.pill { display:inline-block; border-radius:999px; padding:3px 10px; font:800 11px 'DM Sans'; letter-spacing:.5px; }
.pill.w { background:#fff4d6; color:#9a6b00; } .pill.c { background:#e6f6f0; color:var(--pos); } .pill.v { background:#fee2e2; color:var(--red); }
.menu { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
.menu button { background:#fff; border:1.5px solid var(--line); border-radius:16px; padding:18px 12px; font:800 14px 'DM Sans'; text-align:left; color:var(--ink); }
.menu button span { display:block; font-size:26px; margin-bottom:6px; }
/* sheet */
.ov { position:fixed; inset:0; background:rgba(0,0,0,.55); z-index:50; display:flex; align-items:flex-end; justify-content:center; }
.sheet { background:#fff; width:100%; max-width:600px; max-height:92vh; overflow:auto; border-radius:22px 22px 0 0; padding:18px 16px calc(20px + env(safe-area-inset-bottom)); animation:up .18s ease-out; }
@keyframes up { from { transform:translateY(30px); opacity:.6; } to { transform:none; opacity:1; } }
.sheet h3 { font:800 20px 'Syne'; margin-bottom:10px; }
.toast { position:fixed; left:50%; transform:translateX(-50%); bottom:calc(150px + env(safe-area-inset-bottom)); background:var(--ink); color:#fff; padding:12px 18px; border-radius:12px; font-weight:700; z-index:80; max-width:90vw; text-align:center; }
.toast.err { background:var(--red); }
.empty { text-align:center; color:var(--gray); padding:26px 10px; font-size:14px; }
.big { font:800 34px 'Syne'; }
.lock { text-align:center; padding:30px 10px; }
.chips { display:flex; gap:8px; flex-wrap:wrap; }
.chip { border:1.5px solid var(--line); background:#fff; border-radius:999px; padding:8px 13px; font:800 13px 'DM Sans'; color:var(--ink); }
.chip.on { background:var(--ink); color:#fff; border-color:var(--ink); }
.note { background:#fff8e1; border-left:4px solid var(--yellow); padding:10px 12px; border-radius:8px; font-size:13px; margin:10px 0; }
</style>
</head>
<body>
<div class="top">
    <div class="shop" id="shopName">KEEP KINYOZI<small>KEEP · BARBERSHOP</small></div>

<script>

// ════════════════════════════════════════════════

   barbers:'Barbers', reports:'Reports', customers:'Customer book', settings:'Settings', backup:'Backup', payouts:'Barber payouts', ownerOnly:'Owner only',
   enterPin:'Enter owner PIN', unlock:'UNLOCK', wrongPin:'Wrong PIN', topServices:'Top services', recent:"Today's jobs", void:'Void', voided:'Voided',
   noJobs:'No jobs yet today.', noQueue:'Nobody is waiting.', paid:'Paid', due:'Owed', payBarber:'Pay', period:'Period', thisWeek:'This week', thisMonth:'This month', lastMonth:'Last month',
   amount:'Amount', note:'Note', category:'Type', from:'From', add:'ADD', price:'Price', cost:'Cost', stock:'Stock', pct:'Commission %', active:'Working',
   shop:'Shop', footer:'Receipt footer message', ownerPin:'Owner PIN (4–8 digits)', language:'Language', download:'DOWNLOAD BACKUP', restore:'RESTORE FROM BACKUP',

   restock:'Add stock', items:'Items', perBarber:'Per barber', search:'Search…', exportCsv:'DOWNLOAD EXCEL (CSV)', today2:'Today', receipt:'Receipt', servedBy:'Served by',
   thanks:'Thank you! Karibu tena.', confirmVoid:'Void this job? It will be removed from takings.', confirmRemove:'Remove?', saved:'Saved', addBarber:'+ Barber', addService:'+ Service', addProduct:'+ Product',
   pinSet:'PIN set', backupNote:'Your records are on this device only. Download a backup every week and keep it safe (WhatsApp, Drive, email).',
   restoreOk:'Backup restored', restoreBad:'This file is not a Keep Kinyozi backup', paidOut:'Payout recorded', mustBarber:'Choose a barber first', mustItem:'Choose a service or product',
   mustAdd:'Payment must add up to the total', productCost:'Product cost', revenue:'Revenue', outOf:'Out', left:'left', lock:'Lock', owner:'Owner',
   wait:'waiting', edit:'Edit', expense:'Expense', rent:'Rent', power:'Electricity (LUKU)', water:'Water', supplies:'Supplies', salary:'Salary', other:'Other',
   noData:'No records for this period.', perHeadShort:'customer', payType:'How paid', payHead:'Per customer', payPct:'Percentage', payService:'Per service', payRent:'Chair rent', perHeadAmt:'Amount per customer (TZS)', pctAmt:'Percentage (%)', rentAmt:'Chair rent per day (TZS)', svcCut:'Barber gets (for this service)', earned:'Earned today', heads:'customers', perDay:'per day', served:'Customers served today', payNow:'PAY', rentDays:'Chair rent', svcCutHint:'Used when a barber is paid "per service"', pilot:'Pilot version · records are on this device' }
};
// ── state ──
let D = load();
const U = { tab: 'job', job: blankJob(), owner: false, ownerAt: 0, rp: 'today', from: null, to: null };
function blankJob() { return { barberId: null, items: {}, customer: { name: '', phone: '' }, discount: 0, cash: null, mobile: 0, queueId: null }; }
function load() {
    try { const d = JSON.parse(localStorage.getItem(KEY) || 'null'); if (d && d.v === 1) return d; } catch (e) {}
    return { v: 1, shop: { name: '', phone: '', address: '', footer: '', lang: 'sw', pin: '' }, barbers: [], services: [], products: [], customers: [], jobs: [], queue: [], expenses: [], payouts: [], seq: 0 };
}
function persist() { try { localStorage.setItem(KEY, JSON.stringify(D)); return true; } catch (e) { toast('⚠️ Storage full — download a backup now', true); return false; } }
const t = k => (T[D.shop.lang] || T.sw)[k] || T.en[k] || k;
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const n0 = v => Math.round(Number(v) || 0).toLocaleString('en-US');
const num = v => { const n = parseFloat(String(v ?? '').replace(/,/g, '')); return isFinite(n) ? n : 0; };
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const dayStr = (d = new Date()) => d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
const tm = ms => new Date(ms).toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit' });
const normPhone = p => { let x = String(p || '').replace(/\D/g, ''); if (x.startsWith('0')) x = '255' + x.slice(1); if (x.length === 9) x = '255' + x; return x; };
const pretty = p => { const x = normPhone(p); return x.startsWith('255') && x.length === 12 ? '0' + x.slice(3, 6) + ' ' + x.slice(6, 9) + ' ' + x.slice(9) : p; };
const barber = id => D.barbers.find(b => b.id === id);
const PAYTYPES = () => [['head', t('payHead')], ['service', t('payService')], ['pct', t('payPct')], ['rent', t('payRent')]];
function payDesc(b) { const ty = b.payType || 'pct'; return ty === 'head' ? n0(b.perHead) + ' / ' + t('perHeadShort') : ty === 'rent' ? t('payRent') + ' ' + n0(b.rent) + ' ' + t('perDay') : ty === 'service' ? t('payService') : (b.pct || 0) + '%'; }
// what the barber earns from one job (services only; products stay with the shop)
function jobPay(b, svcGross, disc, items) {
    const ty = b.payType || 'pct', svcNet = Math.max(0, svcGross - disc);
    if (ty === 'head') return Math.min(svcNet, Math.round(b.perHead || 0));
    if (ty === 'service') return Math.min(svcNet, items.filter(i => i.t === 's').reduce((a, i) => { const s = D.services.find(x => x.id === i.id); return a + (s && s.cut ? s.cut : 0) * i.qty; }, 0));
    if (ty === 'rent') return svcNet;            // keeps the service money, pays chair rent per working day
    return Math.round(svcNet * (b.pct || 0) / 100);
}
const initial = s => (String(s || '?').trim()[0] || '?').toUpperCase();
function toast(m, err) { document.querySelectorAll('.toast').forEach(x => x.remove()); const e = document.createElement('div'); e.className = 'toast' + (err ? ' err' : ''); e.textContent = m; document.body.appendChild(e); setTimeout(() => e.remove(), err ? 3800 : 2200); }
function sheet(html) { closeSheet(); const o = document.createElement('div'); o.className = 'ov'; o.id = 'ov'; o.innerHTML = `<div class="sheet">${html}</div>`; o.onclick = e => { if (e.target === o) closeSheet(); }; document.body.appendChild(o); return o; }
function closeSheet() { const o = $('ov'); if (o) o.remove(); }
function confirmBox(msg, yes, cb) { sheet(`<h3>${esc(msg)}</h3><div class="grid2" style="margin-top:14px;"><button class="btn sec" onclick="closeSheet()">${t('cancel')}</button><button class="btn red" id="cfYes">${esc(yes)}</button></div>`); $('cfYes').onclick = () => { closeSheet(); cb(); }; }

// ── owner lock (PIN) ──
async function sha(s) { try { const b = await crypto.subtle.digest('SHA-256', new TextEncoder().encode('keep-kinyozi:' + s)); return [...new Uint8Array(b)].map(x => x.toString(16).padStart(2, '0')).join(''); } catch (e) { return 'p:' + s; } }
function isOwner() { if (U.owner && Date.now() - U.ownerAt > 10 * 60 * 1000) U.owner = false; return U.owner || !D.shop.pin; }
function toggleOwner() { if (isOwner() && D.shop.pin) { U.owner = false; renderTop(); render(); toast('🔒 ' + t('lock')); } else askPin(() => { renderTop(); render(); }); }
function askPin(ok) {
    if (!D.shop.pin) { ok(); return; }
    sheet(`<h3>🔐 ${t('enterPin')}</h3><input class="i" id="pinIn" type="password" inputmode="numeric" maxlength="8" autocomplete="off" style="font-size:24px;letter-spacing:6px;text-align:center;">
      <button class="btn pri" style="margin-top:12px;" id="pinGo">${t('unlock')}</button>`);
    const go = async () => { if (await sha($('pinIn').value) === D.shop.pin) { U.owner = true; U.ownerAt = Date.now(); closeSheet(); ok(); } else { toast(t('wrongPin'), true); $('pinIn').value = ''; } };
    $('pinGo').onclick = go; $('pinIn').onkeydown = e => { if (e.key === 'Enter') go(); }; setTimeout(() => $('pinIn').focus(), 60);
}
function ownerGate(fn) { if (isOwner()) { U.ownerAt = Date.now(); fn(); } else askPin(fn); }

// ── top + tabs ──
function renderTop() {

    const q = D.queue.length;
    $('tabs').innerHTML = [['job', '✂️', t('job')], ['queue', '🪑', t('queue')], ['today', '📊', t('today')], ['more', '☰', t('more')]]

function toggleLang() { D.shop.lang = D.shop.lang === 'en' ? 'sw' : 'en'; persist(); document.documentElement.lang = D.shop.lang; renderTop(); render(); }
function go(tab) { U.tab = tab; renderTop(); render(); window.scrollTo(0, 0); }
function render() {
    $('sumbar').classList.add('hidden');
    if (!D.shop.name) return renderSetup();

function suValLabel() { const k = U.suPay || 'head'; return k === 'head' ? t('perHeadAmt') : k === 'pct' ? t('pctAmt') : k === 'rent' ? t('rentAmt') : t('svcCut'); }
function suDrawBarbers() { const svc = (U.suPay || 'head') === 'service'; $('suBarbers').innerHTML = U.suB.map((b, i) => `<div class="grid2" style="grid-template-columns:${svc ? '1fr' : '2fr 1fr'};margin-bottom:6px;"><input class="i" placeholder="${t('name')} ${i + 1}" value="${esc(b.name)}" oninput="U.suB[${i}].name=this.value">${svc ? '' : `<input class="i" type="number" inputmode="numeric" placeholder="${(U.suPay || 'head') === 'pct' ? '50' : (U.suPay || 'head') === 'rent' ? '10000' : '2500'}" value="${b.v}" oninput="U.suB[${i}].v=this.value">`}</div>`).join(''); }
function suAddBarber() { U.suB.push({ name: '', v: '' }); suDrawBarbers(); }
async function finishSetup() {
    const name = $('suName').value.trim(), pin = $('suPin').value.trim();

    if (!/^\d{4,8}$/.test(pin)) return toast(t('ownerPin'), true);

// ════════════ NEW JOB ════════════
const jobTotals = () => {
    let sub = 0, svc = 0;
    Object.entries(U.job.items).forEach(([k, q]) => { const [ty, id] = k.split(':'); const it = ty === 's' ? D.services.find(x => x.id === id) : D.products.find(x => x.id === id); if (it) { sub += it.price * q; if (ty === 's') svc += it.price * q; } });
    const disc = Math.min(sub, Math.max(0, U.job.discount || 0));
    return { sub, svc, disc, total: sub - disc };
};
function renderJob() {
    const busy = new Set(D.queue.filter(q => q.status === 'chair').map(q => q.barberId));
    const act = D.barbers.filter(b => b.active);
    const items = U.job.items;
    $('main').innerHTML = `
      <h2>${t('chooseBarber')}</h2>
      <div class="barbers">${act.map(b => `<button class="barber ${U.job.barberId === b.id ? 'on' : ''}" onclick="pickBarber('${b.id}')"><div class="av" style="background:${b.color}">${esc(initial(b.name))}</div>${esc(b.name)}${busy.has(b.id) ? `<div class="busy">● ${t('inChair')}</div>` : ''}</button>`).join('') || `<div class="muted">${t('barbers')} → ${t('settings')}</div>`}</div>
      <h2>${t('services')}</h2>
      <div class="grid3">${D.services.filter(s => s.active).map(s => { const q = items['s:' + s.id] || 0; return `<button class="tile ${q ? 'on' : ''}" onclick="addItem('s','${s.id}')">${q ? `<span class="q">${q}</span>` : ''}<b>${esc(s.name)}</b><span class="p">${n0(s.price)}</span>${s.mins ? `<div class="s">⏱ ${s.mins} ${t('mins')}</div>` : ''}</button>`; }).join('')}</div>
      ${D.products.some(p => p.active) ? `<h2>${t('products')}</h2><div class="grid3">${D.products.filter(p => p.active).map(p => { const q = items['p:' + p.id] || 0, out = p.stock - q <= 0 && !q; return `<button class="tile ${q ? 'on' : ''} ${p.stock <= 0 ? 'out' : ''}" onclick="addItem('p','${p.id}')" ${p.stock <= 0 ? 'disabled' : ''}>${q ? `<span class="q">${q}</span>` : ''}<b>${esc(p.name)}</b><span class="p">${n0(p.price)}</span><div class="s">${p.stock <= 0 ? '❌ ' + t('outOf') : p.stock + ' ' + t('left')}</div></button>`; }).join('')}</div>` : ''}
      <div style="height:20px"></div>`;
    drawSumbar();
}
function pickBarber(id) { U.job.barberId = U.job.barberId === id ? null : id; renderJob(); }
function addItem(ty, id) {
    const k = ty + ':' + id, cur = U.job.items[k] || 0;
    if (ty === 'p') { const p = D.products.find(x => x.id === id); if (!p || cur >= p.stock) return toast(t('outOf'), true); }
    U.job.items[k] = cur + 1; renderJob();
}
function drawSumbar() {
    const n = Object.values(U.job.items).reduce((a, b) => a + b, 0), x = jobTotals(), sb = $('sumbar');

function openCheckout() {
    if (!U.job.barberId) return toast(t('mustBarber'), true);

function decItem(k) { U.job.items[k]--; if (U.job.items[k] <= 0) delete U.job.items[k]; U.job.cash = null; renderJob(); if (Object.keys(U.job.items).length) openCheckout(); else closeSheet(); }
function coCust() { const c = D.customers.find(x => x.name.toLowerCase() === $('coName').value.trim().toLowerCase()); if (c && !$('coPhone').value) $('coPhone').value = pretty(c.phone || ''); }
function coRecalc() { U.job.discount = num($('coDisc').value); const x = jobTotals(); $('coTot').textContent = n0(x.total) + ' TZS'; $('coCash').value = Math.max(0, x.total - num($('coMob').value)); }
function coAll(w) { const x = jobTotals(); $('coCash').value = w === 'cash' ? x.total : 0; $('coMob').value = w === 'mobile' ? x.total : 0; }
function saveJob() {
    U.job.discount = num($('coDisc').value);
    const x = jobTotals(), cash = num($('coCash').value), mobile = num($('coMob').value);
    if (Math.abs(cash + mobile - x.total) > 0.5) return toast(t('mustAdd'), true);
    const b = barber(U.job.barberId), name = $('coName').value.trim(), phone = normPhone($('coPhone').value);
    const items = Object.entries(U.job.items).map(([k, q]) => { const [ty, id] = k.split(':'); const it = ty === 's' ? D.services.find(s => s.id === id) : D.products.find(p => p.id === id); return { t: ty, id, name: it.name, price: it.price, qty: q, cost: ty === 'p' ? (it.cost || 0) : 0 }; });
    // commission on services only, after discount (discount comes off services first)
    const commission = jobPay(b, x.svc, x.disc, items);
    let cust = null;
    if (name || phone) {
        cust = D.customers.find(c => (phone && c.phone === phone) || (name && c.name.toLowerCase() === name.toLowerCase()));
        if (!cust) { cust = { id: uid(), name: name || pretty(phone), phone, visits: 0, spent: 0, lastVisit: 0 }; D.customers.push(cust); }
        if (phone && !cust.phone) cust.phone = phone;
        cust.visits++; cust.spent += x.total; cust.lastVisit = Date.now();
    }
    D.seq = (D.seq || 0) + 1;
    const now = Date.now(), job = { id: uid(), no: 'K' + dayStr().slice(2).replace(/-/g, '') + '-' + String(D.seq).padStart(4, '0'), at: now, day: dayStr(), barberId: b.id, barberName: b.name, payType: b.payType || 'pct', pct: b.pct,
        items, sub: x.sub, discount: x.disc, total: x.total, cash, mobile, commission, customerId: cust ? cust.id : null, customerName: cust ? cust.name : '', customerPhone: cust ? cust.phone : '', voided: false };
    D.jobs.push(job);
    items.forEach(i => { if (i.t === 'p') { const p = D.products.find(y => y.id === i.id); if (p) p.stock -= i.qty; } });
    if (U.job.queueId) D.queue = D.queue.filter(q => q.id !== U.job.queueId);
    persist();
    U.job = blankJob(); renderTop(); renderJob();
    sheet(`<div style="text-align:center;"><div style="font-size:54px;">✅</div><h3>${t('done')}</h3><div class="big" style="color:var(--pos);">${n0(job.total)} TZS</div><p class="muted">${esc(job.no)} · ✂️ ${esc(job.barberName)}${job.customerName ? ' · ' + esc(job.customerName) : ''}</p></div>
      <button class="btn pri" style="margin-top:16px;" onclick="sendReceipt('${job.id}')">💬 ${t('sendWa')}</button>
      <button class="btn yel" style="margin-top:8px;" onclick="closeSheet()">✂️ ${t('newJob')}</button>`);
}
function receiptText(j) {
    const L = [`*${D.shop.name.toUpperCase()}*`]; if (D.shop.address) L.push(D.shop.address); if (D.shop.phone) L.push('📞 ' + pretty(D.shop.phone));
    L.push('', `🧾 ${j.no} · ${new Date(j.at).toLocaleDateString('en-GB')} ${tm(j.at)}`, `✂️ ${t('servedBy')}: ${j.barberName}`);
    if (j.customerName) L.push('👤 ' + j.customerName);
    L.push(''); j.items.forEach(i => L.push(`${i.name}${i.qty > 1 ? ' × ' + i.qty : ''} — ${n0(i.price * i.qty)}`));
    if (j.discount) L.push(`${t('discount')}: −${n0(j.discount)}`);
    L.push('━━━━━━━━', `*${t('total').toUpperCase()}: TZS ${n0(j.total)}*`);
    if (j.cash) L.push(`${t('cash')}: ${n0(j.cash)}`); if (j.mobile) L.push(`${t('mobile')}: ${n0(j.mobile)}`);
    L.push(''); if (D.shop.footer) L.push(D.shop.footer); L.push(t('thanks'), '_Keep Kinyozi_');
    return L.join('\n');
}
function sendReceipt(id) { const j = D.jobs.find(x => x.id === id); if (!j) return; const to = j.customerPhone || ''; window.open(`https://wa.me/${to}?text=${encodeURIComponent(receiptText(j))}`, '_blank'); }

function qAdd() { const name = $('qName').value.trim(); if (!name) return toast(t('name') + '?', true); D.queue.push({ id: uid(), name, phone: normPhone($('qPhone').value), barberId: U.qBarber || null, at: Date.now(), status: 'waiting' }); U.qBarber = ''; persist(); renderTop(); renderQueue(); }
function qStart(id) {

function qFinish(id) { const q = D.queue.find(x => x.id === id); if (!q) return; U.job = blankJob(); U.job.barberId = q.barberId; U.job.customer = { name: q.name, phone: q.phone ? pretty(q.phone) : '' }; U.job.queueId = q.id; go('job'); toast('✂️ ' + q.name); }
function qRemove(id) { confirmBox(t('confirmRemove'), t('remove'), () => { D.queue = D.queue.filter(q => q.id !== id); persist(); renderTop(); renderQueue(); }); }

// ════════════ FIGURES ════════════
function fig(from, to) {
    const J = D.jobs.filter(j => !j.voided && j.day >= from && j.day <= to);
    const E = D.expenses.filter(e => e.day >= from && e.day <= to), P = D.payouts.filter(p => p.day >= from && p.day <= to);
    const f = { jobs: J.length, revenue: 0, cash: 0, mobile: 0, commission: 0, productCost: 0, expenses: E.reduce((a, e) => a + e.amount, 0), payouts: P.reduce((a, p) => a + p.amount, 0), per: {}, svc: {}, J, E };
    J.forEach(j => {
        f.revenue += j.total; f.cash += j.cash; f.mobile += j.mobile; f.commission += j.commission;
        j.items.forEach(i => { if (i.t === 'p') f.productCost += (i.cost || 0) * i.qty; else { f.svc[i.name] = (f.svc[i.name] || 0) + i.qty; } });
        const r = f.per[j.barberId] = f.per[j.barberId] || { jobs: 0, takings: 0, commission: 0, paid: 0 };
        r.jobs++; r.takings += j.total; r.commission += j.commission;
    });
    // chair rent: charged for each day the barber worked
    D.barbers.forEach(b => { if ((b.payType) !== 'rent' || !b.rent) return; const days = new Set(J.filter(j => j.barberId === b.id).map(j => j.day)).size; if (!days) return; const r = f.per[b.id]; r.rent = days * b.rent; r.commission -= r.rent; f.commission -= r.rent; });
    P.forEach(p => { const r = f.per[p.barberId] = f.per[p.barberId] || { jobs: 0, takings: 0, commission: 0, paid: 0 }; r.paid += p.amount; });
    f.profit = f.revenue - f.commission - f.productCost - f.expenses;
    return f;
}
// what each barber is owed overall (all time): commission earned − paid
function owedAll(bid) { const r = fig('0000-00-00', '9999-99-99').per[bid]; return r ? r.commission - r.paid : 0; }

function exportCsv(from, to) {

    const p = id ? D.products.find(x => x.id === id) : { name: '', price: 0, cost: 0, stock: 0, active: true };
    sheet(`<h3>🧴 ${id ? esc(p.name) : t('addProduct')}</h3><label class="f">${t('name')}</label><input class="i" id="epName" value="${esc(p.name)}">
      <div class="grid2"><div><label class="f">${t('price')}</label><input class="i" id="epPrice" type="number" inputmode="numeric" value="${p.price || ''}"></div><div><label class="f">${t('cost')}</label><input class="i" id="epCost" type="number" inputmode="numeric" value="${p.cost || ''}"></div></div>
      <div class="grid2"><div><label class="f">${t('stock')}</label><input class="i" id="epStock" type="number" inputmode="numeric" value="${p.stock}" ${id ? 'disabled' : ''}></div><div><label class="f">${t('restock')}</label><input class="i" id="epAdd" type="number" inputmode="numeric" placeholder="+0" ${id ? '' : 'disabled'}></div></div>
      <label style="display:flex;gap:8px;align-items:center;margin-top:12px;font-weight:700;"><input type="checkbox" id="epAct" ${p.active ? 'checked' : ''}> ${t('active')}</label>
      <button class="btn go" style="margin-top:14px;" id="epSave">${t('save')}</button>`);
    $('epSave').onclick = () => { const name = $('epName').value.trim(), price = num($('epPrice').value); if (!name || !(price > 0)) return toast(t('name') + ' / ' + t('price') + '?', true);
        const v = { name, price, cost: num($('epCost').value), active: $('epAct').checked };
        if (id) { Object.assign(p, v); p.stock += Math.round(num($('epAdd').value)); } else D.products.push({ id: uid(), ...v, stock: Math.round(num($('epStock').value)) });
        persist(); closeSheet(); renderSettings(); };
}

// ── backup ──
function renderBackup() {
    if (!isOwner()) return go('more');
    $('main').innerHTML = `${back()}<div class="note">🛟 ${t('backupNote')}</div>
      <button class="btn pri" onclick="downloadBackup()">⬇️ ${t('download')}</button>
      <button class="btn sec" style="margin-top:10px;" onclick="$('rsFile').click()">📂 ${t('restore')}</button>
      <input type="file" id="rsFile" accept="application/json,.json" class="hidden" onchange="restoreBackup(this)">
      <p class="muted" style="margin-top:14px;">${t('jobs')}: ${D.jobs.length} · ${t('customers')}: ${D.customers.length} · ${t('expenses')}: ${D.expenses.length}</p>`;
}
function downloadBackup() { dl(new Blob([JSON.stringify({ app: 'keep-kinyozi', madeAt: new Date().toISOString(), data: D })], { type: 'application/json' }), `Keep_Kinyozi_backup_${dayStr()}.json`); D.lastBackup = Date.now(); persist(); }
function restoreBackup(input) {
    const f = input.files && input.files[0]; input.value = ''; if (!f) return;
    const r = new FileReader(); r.onload = () => { try { const o = JSON.parse(r.result); if (o.app !== 'keep-kinyozi' || !o.data || o.data.v !== 1) throw 0;
        confirmBox(t('restore') + '?', t('restore'), () => { D = o.data; persist(); renderTop(); go('today'); toast(t('restoreOk')); }); } catch (e) { toast(t('restoreBad'), true); } };
    r.readAsText(f);
}

// ── boot ──
document.documentElement.lang = D.shop.lang;
renderTop(); render();
setInterval(() => { if (U.tab === 'queue' && !$('ov') && !($('qName') && ($('qName').value || document.activeElement === $('qName')))) renderQueue(); }, 60000);
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
</body>
